[project]
name = "refinder-extractors"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "python-docx>=1.1.2,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
  "pypdf>=5,<8"
]

[project.scripts]
refinder-index = "refinder.cli:main"

[tool.setuptools.packages.find]
include = ["refinder*"]
